name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run Ruff linter
      run: |
        ruff check . --output-format=github

    - name: Lint Summary
      if: always()
      run: |
        echo "## Lint Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        ruff check . --statistics >> $GITHUB_STEP_SUMMARY || true
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Run \`ruff check . --fix\` locally to auto-fix issues" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint  # Run tests only if lint passes

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --ignore=tests/test_backtest_data.py \
          --cov --cov-report=term-missing --cov-report=json --cov-report=html \
          --tb=short -v

    - name: Coverage report
      if: always()
      run: |
        coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          htmlcov/
          coverage.json
          .coverage
        retention-days: 30

    - name: Check coverage threshold
      if: always()
      run: |
        COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")
        echo "Current coverage: ${COVERAGE}%"
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage Status" >> $GITHUB_STEP_SUMMARY
        echo "- Current: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
        echo "- Target: 85%" >> $GITHUB_STEP_SUMMARY
        echo "- Gap: $(python -c "print(f'{85 - ${COVERAGE}:.2f}%')")" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if (( $(echo "$COVERAGE < 85" | bc -l) )); then
          echo "⚠️ Coverage below 85% target (not enforced yet)" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ Coverage meets 85% target!" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Test Summary
      if: always()
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f .pytest_cache/v/cache/lastfailed ]; then
          echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
        fi
