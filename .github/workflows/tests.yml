name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run Ruff linter
      run: |
        ruff check . --output-format=github

    - name: Lint Summary
      if: always()
      run: |
        echo "## Lint Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        ruff check . --statistics >> $GITHUB_STEP_SUMMARY || true
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Run \`ruff check . --fix\` locally to auto-fix issues" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint  # Run tests only if lint passes

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --ignore=tests/test_backtest_data.py \
          --cov=. --cov-branch \
          --cov-report=term-missing \
          --cov-report=json:coverage.json \
          --cov-report=xml:coverage.xml \
          --cov-report=html:htmlcov \
          --cov-fail-under=75 \
          --tb=short -v

    - name: Coverage report
      if: always()
      run: |
        coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

    - name: Generate coverage gap report
      if: always()
      run: |
        python scripts/governance/coverage_gap_report.py \
          --input coverage.json \
          --json-out reports/coverage/gap_report.json \
          --md-out reports/coverage/gap_report.md \
          --top 20

    - name: Enforce module coverage thresholds
      if: always()
      run: |
        python scripts/governance/check_coverage_thresholds.py \
          --input coverage.json \
          --min-line 75 \
          --min-branch 65 \
          --min-server-line 60

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          htmlcov/
          coverage.json
          coverage.xml
          reports/coverage/gap_report.json
          reports/coverage/gap_report.md
          .coverage
        retention-days: 30

    - name: Coverage summary
      if: always()
      run: |
        COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")
        BRANCH=$(python -c "import json; print(json.load(open('coverage.json'))['totals'].get('percent_branches_covered', 0))")
        echo "Current coverage: ${COVERAGE}%"
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage Status" >> $GITHUB_STEP_SUMMARY
        echo "- Overall line coverage: ${COVERAGE}% (floor: 75%)" >> $GITHUB_STEP_SUMMARY
        echo "- Overall branch coverage: ${BRANCH}% (floor: 65%)" >> $GITHUB_STEP_SUMMARY
        echo "- Targeted package floor: server/ line >= 60% (enforced by scripts/governance/check_coverage_thresholds.py)" >> $GITHUB_STEP_SUMMARY
        echo "- Gap report artifact: reports/coverage/gap_report.md" >> $GITHUB_STEP_SUMMARY

    - name: Test Summary
      if: always()
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f .pytest_cache/v/cache/lastfailed ]; then
          echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
        fi
