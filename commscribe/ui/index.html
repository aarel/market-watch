<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market-Watch Communicate Runtime</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="market-watch-theme.css" id="market-theme" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>Communicate Input Pad</h1>
      <div class="input-section">
        <textarea id="input" placeholder="Write one request and submit"></textarea>
        <button id="submit">Submit Request</button>
        <p class="small">Deep link format: <code>?req=REQ-YYYYMMDD-HHMMSS</code> or <code>#/REQ-...</code></p>
      </div>
      <h2 class="section-title">Requests</h2>
      <div class="filter-row">
        <label for="req-date" class="small">Date</label>
        <input id="req-date" type="date" />
      </div>
      <button id="toggle-sort" class="secondary">Sort: Newest</button>
      <ul id="request-list" class="request-list">
        <li class="request-link muted">Loading requests...</li>
      </ul>
    </section>
    <section class="card">
      <div class="toolbar">
        <button id="copy-link" class="secondary">Copy REQ Link</button>
        <button id="copy-output" class="secondary">Copy Output</button>
        <button id="refresh-now" class="secondary">Refresh Now</button>
        <button id="clear-selection" class="secondary">Back To List</button>
        <button id="toggle-theme" class="secondary" aria-pressed="true">Use Default Theme</button>
      </div>
      <h2 id="detail-title" tabindex="-1">Request Detail</h2>
      <p id="detail-meta" class="small">Select a REQ to view details.</p>
      <div id="detail" class="detail-grid">
        <div class="detail-block muted">No REQ selected.</div>
      </div>
    </section>
  </main>
  <script>
    let selectedReq = '';
    let requestIndex = [];
    let selectedRequestData = null;
    let marketThemeEnabled = true;
    let sortMode = 'newest';
    let refreshPauseUntil = 0;
    let refreshInFlight = false;
    let copyInFlight = false;
    let lastInputPadValue = '';
    let lastRequestListSig = '';
    let lastDetailSigByReq = {};
    let selectedDate = '';

    function escapeRegExp(value) {
      return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function linkifyReqIds(text) {
      const safe = escapeHtml(text || '');
      return safe.replace(/\bREQ-\d{8}-\d{6}\b/g, (reqId) => {
        const encoded = encodeURIComponent(reqId);
        return `<a href="?req=${encoded}#/${encoded}" class="req-inline-link" data-req-nav="${reqId}">${reqId}</a>`;
      });
    }

    function highlightSelectedRequest(reqId) {
      const selector = `a[data-req="${escapeRegExp(reqId)}"]`;
      const node = document.querySelector(selector);
      if (!node) return;
      node.classList.add('req-jump-highlight');
      setTimeout(() => node.classList.remove('req-jump-highlight'), 1200);
    }

    function highlightDetailHeader() {
      const title = document.getElementById('detail-title');
      if (!title) return;
      title.classList.add('req-jump-highlight');
      setTimeout(() => title.classList.remove('req-jump-highlight'), 1200);
    }

    function bindReqLinks(root) {
      if (!root) return;
      root.querySelectorAll('a[data-req-nav]').forEach((node) => {
        node.addEventListener('click', (event) => {
          event.preventDefault();
          const reqId = node.getAttribute('data-req-nav') || '';
          if (!reqId) return;
          navigateToReq(reqId, { highlight: true });
        });
      });
    }

    function parseSelectedReqFromLocation() {
      const params = new URLSearchParams(window.location.search);
      const reqFromQuery = (params.get('req') || '').trim();
      if (reqFromQuery) return reqFromQuery;
      const hash = (window.location.hash || '').replace(/^#\/?/, '').trim();
      if (/^REQ-/i.test(hash)) return hash;
      return '';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function extractBlock(text, key) {
      const rx = new RegExp(`${key}:\\s*>?\\n([\\s\\S]*?)(?:\\n[a-z_]+:\\s|$)`, 'i');
      const m = String(text || '').match(rx);
      return m ? m[1].trim() : '';
    }

    function renderRequestList() {
      const list = document.getElementById('request-list');
      if (!requestIndex.length) {
        list.innerHTML = '<li class="request-link muted">No requests yet.</li>';
        return;
      }
      const statusClass = (status) => `status-chip status-${String(status || '').toLowerCase()}`;
      list.innerHTML = requestIndex.map((r) => {
        const active = r.request_id === selectedReq ? 'active' : '';
        const href = `?req=${encodeURIComponent(r.request_id)}`;
        return `
          <li>
            <a class="request-link ${active}" href="${href}" data-req="${escapeHtml(r.request_id)}">
              <div class="req-row"><strong>${escapeHtml(r.request_id)}</strong> <span class="${statusClass(r.status)}">${escapeHtml(r.status)}</span></div>
              <div class="meta-row">updated=${escapeHtml(formatUpdatedCst(r.last_updated_at || ''))}</div>
            </a>
          </li>
        `;
      }).join('');
      list.querySelectorAll('a[data-req]').forEach((a) => {
        a.addEventListener('click', (event) => {
          event.preventDefault();
          navigateToReq(a.getAttribute('data-req'));
        });
      });
    }

    function parseReqTimestamp(req) {
      const raw = req.created_at || req.last_updated_at || '';
      const ts = Date.parse(raw);
      return Number.isFinite(ts) ? ts : 0;
    }

    function formatUpdatedCst(value) {
      const ts = Date.parse(String(value || ''));
      if (!Number.isFinite(ts)) return '';
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Chicago',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false,
      }).formatToParts(new Date(ts));
      const get = (type) => parts.find((p) => p.type === type)?.value || '00';
      return `${get('year')}-${get('month')}-${get('day')} ${get('hour')}:${get('minute')}:${get('second')}`;
    }

    function sortRequestList(requests) {
      const sorted = [...requests].sort((a, b) => {
        const diff = parseReqTimestamp(b) - parseReqTimestamp(a);
        if (diff !== 0) return diff;
        return String(b.request_id || '').localeCompare(String(a.request_id || ''));
      });
      if (sortMode === 'oldest') {
        sorted.reverse();
      }
      return sorted;
    }

    function setDetailEmpty(message) {
      selectedRequestData = null;
      document.getElementById('detail-meta').textContent = message || 'Select a REQ to view details.';
      document.getElementById('detail').innerHTML = '<div class="detail-block muted">No REQ selected.</div>';
    }

    function renderDetail(req) {
      if (!req) {
        setDetailEmpty('Select a REQ to view details.');
        return;
      }
      selectedRequestData = req;
      const objective = extractBlock(req.request_text, 'objective') || req.request_text;
      const constraints = extractBlock(req.request_text, 'constraints');
      document.getElementById('detail-meta').innerHTML = `<strong>${escapeHtml(req.request_id)}</strong> <span class="status-chip status-${escapeHtml(String(req.status || '').toLowerCase())}">${escapeHtml(req.status || '')}</span> <span class="muted">updated ${escapeHtml(formatUpdatedCst(req.last_updated_at || ''))}</span>`;
      document.getElementById('detail').innerHTML = `
        <div class="detail-block"><h3>Objective</h3><pre>${linkifyReqIds(objective || '(none)')}</pre></div>
        <div class="detail-block"><h3>Assumptions / Constraints</h3><pre>${linkifyReqIds(constraints || '(none)')}</pre></div>
        <div class="detail-block"><h3>Plan / Ack</h3><pre>${linkifyReqIds(req.codex_ack_plan || '(none)')}</pre></div>
        <div class="detail-block"><h3>Execution Log</h3><pre>${linkifyReqIds(req.execution_log || '(none)')}</pre></div>
        <div class="detail-block"><h3>Outputs</h3><pre id="selected-output-block">${linkifyReqIds(req.outputs || '(none)')}</pre></div>
        <div class="detail-block"><h3>Evidence</h3><pre>${linkifyReqIds(req.evidence || '(none)')}</pre></div>
        <div class="detail-block"><h3>Transcript</h3><pre>${linkifyReqIds(req.request_text || '(none)')}</pre></div>
      `;
      bindReqLinks(document.getElementById('detail'));
      const title = document.getElementById('detail-title');
      title.scrollIntoView({ behavior: 'smooth', block: 'start' });
      title.focus();
    }

    async function loadInputPad() {
      const res = await fetch('/api/thread');
      if (!res.ok) return false;
      const data = await res.json();
      const inputPad = String(data.input_pad || '');
      if (inputPad === lastInputPadValue) return false;
      lastInputPadValue = inputPad;
      const inputEl = document.getElementById('input');
      // Preserve user typing: avoid replacing focused input.
      if (document.activeElement !== inputEl && inputPad && !inputPad.startsWith('Paste request text here')) {
        inputEl.value = inputPad;
      }
      return true;
    }

    function requestListSignature(requests) {
      return JSON.stringify(
        requests.map((r) => [r.request_id || '', r.status || '', r.last_updated_at || '', r.created_at || ''])
      );
    }

    function detailSignature(req) {
      if (!req) return '';
      return JSON.stringify([
        req.request_id || '',
        req.status || '',
        req.last_updated_at || '',
        req.codex_ack_plan || '',
        req.execution_log || '',
        req.outputs || '',
        req.evidence || '',
        req.request_text || '',
      ]);
    }

    async function loadRequests(force = false) {
      const source = encodeURIComponent('communicate>');
      const dateParam = selectedDate ? `&date=${encodeURIComponent(selectedDate)}` : '';
      const res = await fetch(`/api/requests?source=${source}${dateParam}`);
      if (!res.ok) return false;
      const data = await res.json();
      const sorted = sortRequestList(data.requests || []);
      const sig = requestListSignature(sorted);
      const changed = force || sig !== lastRequestListSig;
      if (changed) {
        requestIndex = sorted;
        renderRequestList();
        lastRequestListSig = sig;
      }
      if (selectedReq) {
        const detailChanged = await loadDetail(selectedReq, force);
        return changed || detailChanged;
      }
      if (changed) {
        setDetailEmpty('Select a REQ to view details.');
      }
      return changed;
    }

    async function loadDetail(reqId, force = false) {
      if (!reqId) {
        renderDetail(null);
        return true;
      }
      const res = await fetch(`/api/request/${encodeURIComponent(reqId)}`);
      if (!res.ok) {
        renderDetail(null);
        return true;
      }
      const data = await res.json();
      const req = data.request || null;
      const sig = detailSignature(req);
      if (!force && lastDetailSigByReq[reqId] === sig) {
        return false;
      }
      lastDetailSigByReq[reqId] = sig;
      renderDetail(data.request);
      return true;
    }

    function hasActiveSelection() {
      const selection = window.getSelection();
      return Boolean(selection && !selection.isCollapsed && String(selection).trim());
    }

    function isUserInteracting() {
      if (copyInFlight) return true;
      if (Date.now() < refreshPauseUntil) return true;
      const active = document.activeElement;
      if (active && (active.tagName === 'TEXTAREA' || active.tagName === 'INPUT')) return true;
      if (hasActiveSelection()) return true;
      return false;
    }

    function captureUiState() {
      const list = document.getElementById('request-list');
      const detail = document.getElementById('detail');
      const input = document.getElementById('input');
      const active = document.activeElement;
      return {
        windowY: window.scrollY,
        listTop: list ? list.scrollTop : 0,
        detailTop: detail ? detail.scrollTop : 0,
        inputFocused: active === input,
        inputSelectionStart: active === input ? input.selectionStart : null,
        inputSelectionEnd: active === input ? input.selectionEnd : null,
      };
    }

    function restoreUiState(state) {
      const list = document.getElementById('request-list');
      const detail = document.getElementById('detail');
      const input = document.getElementById('input');
      if (list) list.scrollTop = state.listTop;
      if (detail) detail.scrollTop = state.detailTop;
      window.scrollTo(0, state.windowY);
      if (state.inputFocused) {
        input.focus();
        if (state.inputSelectionStart !== null && state.inputSelectionEnd !== null) {
          input.setSelectionRange(state.inputSelectionStart, state.inputSelectionEnd);
        }
      }
    }

    async function refresh(force = false) {
      if (refreshInFlight) return;
      if (!force && isUserInteracting()) return;
      if (Date.now() < refreshPauseUntil) {
        return;
      }
      refreshInFlight = true;
      const uiState = captureUiState();
      try {
        selectedReq = parseSelectedReqFromLocation();
        if (!selectedDate) {
          const d = new Date();
          selectedDate = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
          document.getElementById('req-date').value = selectedDate;
        }
        const inputChanged = await loadInputPad();
        const requestsChanged = await loadRequests(force);
        if (force || inputChanged || requestsChanged) {
          restoreUiState(uiState);
        }
      } finally {
        refreshInFlight = false;
      }
    }

    function navigateToReq(reqId, opts = {}) {
      selectedReq = reqId || '';
      const url = selectedReq ? `?req=${encodeURIComponent(selectedReq)}#/${encodeURIComponent(selectedReq)}` : window.location.pathname;
      history.pushState({}, '', url);
      refresh(true).then(() => {
        if (opts.highlight && selectedReq) {
          highlightSelectedRequest(selectedReq);
          highlightDetailHeader();
        }
      });
    }

    document.getElementById('submit').addEventListener('click', async () => {
      const text = document.getElementById('input').value.trim();
      if (!text) return;
      const btn = document.getElementById('submit');
      const prior = btn.textContent;
      const res = await fetch('/api/input', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (!res.ok) {
        alert('Failed to create request');
        return;
      }
      const data = await res.json();
      document.getElementById('input').value = '';
      btn.textContent = `Created ${data.request_id || 'Request'}`;
      setTimeout(() => {
        btn.textContent = prior;
      }, 1400);
      await refresh(true);
    });

    document.getElementById('copy-link').addEventListener('click', async () => {
      if (!selectedReq) return;
      const url = `${window.location.origin}${window.location.pathname}?req=${encodeURIComponent(selectedReq)}#/${encodeURIComponent(selectedReq)}`;
      await navigator.clipboard.writeText(url);
    });

    document.getElementById('copy-output').addEventListener('click', async () => {
      if (!selectedReq || !selectedRequestData) return;
      const btn = document.getElementById('copy-output');
      const previousLabel = btn.textContent;
      const outputText = String(selectedRequestData.outputs || '(none)');
      // Copy uses in-memory request snapshot so it remains stable while refresh timer is active.
      copyInFlight = true;
      refreshPauseUntil = Date.now() + 2000;
      try {
        await navigator.clipboard.writeText(outputText);
        btn.textContent = 'Copied ✓';
      } catch (_) {
        btn.textContent = 'Copy failed';
      } finally {
        copyInFlight = false;
        setTimeout(() => {
          btn.textContent = previousLabel;
        }, 1500);
      }
    });

    document.getElementById('refresh-now').addEventListener('click', () => {
      refresh(true);
    });

    document.getElementById('clear-selection').addEventListener('click', () => {
      history.pushState({}, '', window.location.pathname);
      selectedReq = '';
      refresh();
    });

    document.getElementById('req-date').addEventListener('change', (event) => {
      selectedDate = String(event.target.value || '').trim();
      selectedReq = '';
      refresh(true);
    });

    document.getElementById('toggle-theme').addEventListener('click', () => {
      marketThemeEnabled = !marketThemeEnabled;
      const node = document.getElementById('market-theme');
      node.disabled = !marketThemeEnabled;
      const btn = document.getElementById('toggle-theme');
      btn.textContent = marketThemeEnabled ? 'Use Default Theme' : 'Use Market Theme';
      btn.setAttribute('aria-pressed', marketThemeEnabled ? 'true' : 'false');
    });

    document.getElementById('toggle-sort').addEventListener('click', () => {
      sortMode = sortMode === 'newest' ? 'oldest' : 'newest';
      const btn = document.getElementById('toggle-sort');
      btn.textContent = sortMode === 'newest' ? 'Sort: Newest' : 'Sort: Oldest';
      renderRequestList();
    });

    window.addEventListener('popstate', refresh);
    window.addEventListener('hashchange', refresh);

    refresh(true);
    setInterval(() => refresh(false), 4000);
  </script>
</body>
</html>
